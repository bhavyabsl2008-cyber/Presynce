<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Presynce Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #666;
      margin-top: 0;
      margin-bottom: 16px;
    }
    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #d32f2f;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Presynce Chalkpad Bridge</h1>
  <p>Sync your Chalkpad attendance securely to Presynce.</p>
  <button id="syncBtn">Sync to Presynce</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
